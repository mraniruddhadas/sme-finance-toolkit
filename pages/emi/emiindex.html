<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Calculator | SME Finance Toolkit</title>

    <link rel="stylesheet" href="emi.css">
</head>
<body>
    <a href="../index.html" class="back-btn">← Back to Home</a>

<header>
    <h1>🏦 EMI Calculator</h1>
    <p>Calculate your monthly loan EMI instantly.</p>
</header>

<main class="container">

<div class="card">

<h2>Loan Details</h2>

<div class="form-grid">

<div class="form-group">
<label>Loan Amount (₹)</label>
<input type="number" id="loan" placeholder="Example: 500000">
</div>

<div class="form-group">
<label>Annual Interest Rate (%)</label>
<input type="number" id="rate" placeholder="Example: 10.5">
</div>

<div class="form-group">
<label>Loan Tenure</label>
<input type="number" id="tenure" placeholder="Example: 60">
</div>

<div class="form-group">
<label>Unit</label>

<select id="unit">
<option value="months">Months</option>
<option value="years">Years</option>
</select>

</div>

</div>

<button id="calculateBtn">
Calculate EMI
</button>

<div id="result" class="result hidden"></div>

</div>

</main>

<script src="emi.js"></script>
</body>
</html>
