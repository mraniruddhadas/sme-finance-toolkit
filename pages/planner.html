<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cash Flow Planner</title>

  <link rel="stylesheet" href="../style.css">
</head>

<body>

<header>

  <h1>Cash Flow Planner</h1>

  <p>Plan your monthly business cash flow</p>

</header>

<main>

  <section class="card">

    <h2>Business Information</h2>

    <label for="businessName">Business Name</label>

    <input
      type="text"
      id="businessName"
      placeholder="Enter Business Name">

    <br><br>

    <label for="financialYear">Financial Year</label>

    <input
      type="text"
      id="financialYear"
      placeholder="2026-27">

    <br><br>

    <label for="month">Month</label>

    <select id="month">

      <option>July</option>
      <option>August</option>
      <option>September</option>

    </select>

  </section>
  <section class="card">

    <h2>Opening Balance</h2>

    <label for="openingBalance">Opening Balance</label>

    <input
        type="number"
        id="openingBalance"
        placeholder="₹ Enter Opening Balance">

</section>

<br>

<section class="card">

    <h2>Cash Inflow</h2>

    <div id="income-list">

        <div id="income-list">

  <div class="entry-card">

    <label>Description</label>
    <input type="text" value="Sales">

    <label>Amount</label>
    <input type="number" placeholder="₹0">

  </div>

  <div class="entry-card">

    <label>Description</label>
    <input type="text" value="Customer Collection">

    <label>Amount</label>
    <input type="number" placeholder="₹0">

  </div>

  <div class="entry-card">

    <label>Description</label>
    <input type="text" value="Other Income">

    <label>Amount</label>
    <input type="number" placeholder="₹0">

  </div>

</div>

<button id="add-income-btn" type="button">
➕ Add Income
</button>

</section>

</main>

<script src="../script.js"></script>

</body>

</html>
