<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Calculator | SME Finance Toolkit</title>

    <link rel="stylesheet" href="emi.css">
</head>
<body>
    <a href="../index.html" class="back-btn">← Back to Home</a>

<header>
    <h1>🏦 EMI Calculator</h1>
    <p>Calculate your monthly loan EMI instantly.</p>
</header>

<main class="container">

    <div class="card">

        <label for="loan">Loan Amount (₹)</label>
        <input type="number" id="loan" placeholder="Enter loan amount">

        <label for="rate">Interest Rate (%)</label>
        <input type="number" id="rate" placeholder="Enter annual interest rate">

        <label for="tenure">Loan Tenure (Months)</label>
        <input type="number" id="tenure" placeholder="Enter loan tenure">

        <button>Calculate EMI</button>

    </div>

</main>
</body>

<script src="emi.js"></script>
</html>
